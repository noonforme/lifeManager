name: lifeos
description: Private, local-first life management for Linux.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.4 <3.14.0"
  flutter: "3.47.5"

dependencies:
  flutter:
    sdk: flutter
  drift: 2.35.0
  drift_flutter: 0.3.1
  sqlite3: 3.6.0
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  file_selector: 1.1.0
  path_provider: 2.1.6
  path: 1.9.1
  window_manager: 0.5.2
  uuid: 4.6.0
  clock: 1.1.3
  timezone: 0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  drift_dev: 2.35.0
  build_runner: 2.16.1

flutter:
  uses-material-design: true

  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/archivo/Archivo-Regular.ttf
        - asset: assets/fonts/archivo/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/archivo/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/archivo/Archivo-Bold.ttf
          weight: 700
    - family: AzeretMono
      fonts:
        - asset: assets/fonts/azeret_mono/AzeretMono-Regular.ttf
        - asset: assets/fonts/azeret_mono/AzeretMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/azeret_mono/AzeretMono-Bold.ttf
          weight: 700
    - family: NotoSans
      fonts:
        - asset: assets/fonts/noto_sans/NotoSans-Regular.ttf
        - asset: assets/fonts/noto_sans/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/noto_sans/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/noto_sans/NotoSans-Bold.ttf
          weight: 700
