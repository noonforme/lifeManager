name: Linux release gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FLUTTER: /opt/flutter/bin/flutter
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      CI: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev liblzma-dev libglu1-mesa curl unzip xz-utils zip openjdk-17-jdk-headless
      - name: Install exact Flutter framework revision
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -o "$USER" /opt/flutter
          git -C /opt/flutter init -q
          git -C /opt/flutter remote add origin https://github.com/flutter/flutter.git
          git -C /opt/flutter fetch --depth=1 origin refs/tags/3.47.5:refs/tags/3.47.5
          test "$(git -C /opt/flutter rev-parse 3.47.5^{commit})" = 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
          git -C /opt/flutter checkout --detach 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
          echo /opt/flutter/bin >> "$GITHUB_PATH"
          "$FLUTTER" config --no-analytics --enable-linux-desktop
          "$FLUTTER" precache --linux
      - name: Cache locked package downloads
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.PUB_CACHE }}
          key: linux-ubuntu24-x64-flutter3.47.5-dart3.13.4-${{ hashFiles('pubspec.lock') }}
      - name: Format, analysis, schema and privacy
        run: python3 tool/ci/run.py checks --evidence build/ci-evidence
      - name: Flutter tests including retained workflow, migrations and recovery
        run: python3 tool/ci/run.py tests --evidence build/ci-evidence
      - name: Operations, negative fixtures and native guard regressions
        run: python3 tool/ci/run.py operations --evidence build/ci-evidence
      - name: Build Linux release bundle
        run: python3 tool/ci/run.py build --evidence build/ci-evidence
      - name: Archive executable bundle with permissions and checksum
        run: |
          tar -C build/linux/x64/release -czf build/linux-release-x64.tar.gz bundle
          (cd build && sha256sum linux-release-x64.tar.gz > linux-release-x64.tar.gz.sha256)
      - name: Retain sanitized gate receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-gate-receipts
          path: build/ci-evidence/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain Linux bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-release-x64
          path: |
            build/linux-release-x64.tar.gz
            build/linux-release-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
