[project]
name = "lifeos"
version = "0.1.0"
description = "A private personal reconciliation system"
requires-python = ">=3.14,<3.15"
dependencies = ["Django==6.1.1"]

[dependency-groups]
test = [
  "pytest==9.1.1",
  "pytest-django==4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "lifeos.test_settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers -p tests.bootstrap"
