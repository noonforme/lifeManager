{% extends "base.html" %}
{% block title %}{{ page_title|default:"New transaction" }} · LifeOS{% endblock %}
{% block content %}
<header class="page-header">
  <div><p class="eyebrow">Money register</p><h1>{{ page_title|default:"New transaction" }}</h1></div>
</header>
<form method="post" class="ledger-form" novalidate>
  {% csrf_token %}
  {% include "money/_transaction_form.html" %}
  <div class="form-actions"><button class="button" type="submit">{{ submit_label|default:"Create transaction" }}</button></div>
</form>
{% endblock %}
