<section id="register-{{ register.key }}" data-register-state="{{ register.state }}" aria-labelledby="register-{{ register.key }}-title">
  <header>
    <p>{{ register.state_label }}</p>
    <h2 id="register-{{ register.key }}-title">{{ register.title }}</h2>
  </header>
  <p>{{ register.description }}</p>
  {% if register.recovery_text %}<p>{{ register.recovery_text }}</p>{% endif %}
  {% if register.href %}<a href="{{ register.href }}">Open {{ register.title }}</a>{% endif %}
  {% if register.action_href %}<a href="{{ register.action_href }}">{{ register.action_label }}</a>{% endif %}
</section>
