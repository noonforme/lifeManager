<div class="form-field{% if field.errors %} form-field--invalid{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="field-hint">(optional)</span>{% endif %}</label>
  <p class="field-hint" id="{{ field.id_for_label }}_hint">{{ field.help_text }}</p>
  {% if field.errors %}<div id="{{ field.id_for_label }}_error">{% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}</div>{% endif %}
  {{ field }}
</div>
